# Every value that differs between environments comes from an environment variable,
# with a local-development default after the colon: ${ENV_VAR:default}.
spring:
  application:
    name: biddly-backend
  profiles:
    default: dev
  autoconfigure:
    # Spring Boot's default in-memory user with a random password. Biddly's accounts live in the users table.
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/biddly}
    username: ${DB_USERNAME:biddly}
    password: ${DB_PASSWORD:biddly}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

biddly:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5180}
  scheduler:
    # Starts and closes auctions on time (AuctionLifecycleJob).
    enabled: ${SCHEDULER_ENABLED:true}
    interval-ms: ${SCHEDULER_INTERVAL_MS:5000}
  auth:
    jwt:
      # Signs access tokens (HS256, at least 32 bytes). No default: outside dev and test the app won't start without it.
      secret: ${JWT_SECRET}
    # The refresh cookie is sent over HTTPS only. Local development runs on plain HTTP, so the dev profile turns it off.
    cookie-secure: ${COOKIE_SECURE:true}

---
spring:
  config:
    activate:
      on-profile: dev
  flyway:
    locations: classpath:db/migration,classpath:db/seed
  jpa:
    show-sql: false

biddly:
  auth:
    jwt:
      # Local development only, and public in Git on purpose: it signs tokens for localhost and nothing else.
      secret: ${JWT_SECRET:dev-only-signing-key-not-secret-do-not-reuse}
    cookie-secure: ${COOKIE_SECURE:false}

logging:
  level:
    com.biddly: DEBUG

---
spring:
  config:
    activate:
      on-profile: test

# Tests set auction states themselves and call AuctionLifecycleService directly; a background job would race them.
biddly:
  scheduler:
    enabled: false
  auth:
    jwt:
      secret: test-only-signing-key-not-secret-do-not-reuse
    cookie-secure: false
