# Every value that differs between environments comes from an environment variable,
# with a local-development default after the colon: ${ENV_VAR:default}.
spring:
  application:
    name: biddly-backend
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/biddly}
    username: ${DB_USERNAME:biddly}
    password: ${DB_PASSWORD:biddly}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

biddly:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5180}

---
spring:
  config:
    activate:
      on-profile: dev
  flyway:
    locations: classpath:db/migration,classpath:db/seed
  jpa:
    show-sql: false

logging:
  level:
    com.biddly: DEBUG
